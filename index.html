<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Verbi Italiani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e0f;--surf:#161618;--surf2:#1e1e21;
  --b1:#2a2a2e;--b2:#353538;
  --tx:#f0ede8;--mu:#7a7870;--di:#4a4845;
  --ac:#d4a853;--gr:#4caf7d;--re:#e05c5c;
  --bl:#5b9bd5;--pu:#9b7ed4;--te:#4db8a4;
}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5}

/* ── SHELL ── */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── TOP BAR ── */
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--b1);flex-shrink:0;background:var(--surf)}
.logo{font-family:'Playfair Display',serif;font-size:18px;color:var(--ac);font-style:italic;cursor:pointer;user-select:none;white-space:nowrap}
.logo:hover{opacity:.75}
.logo span{font-style:normal;color:var(--di);font-size:11px;margin-left:5px;font-family:'DM Sans',sans-serif}
.sw{position:relative;flex:1;max-width:240px}
.sw input{width:100%;background:var(--surf2);border:1px solid var(--b1);border-radius:8px;padding:7px 10px 7px 28px;color:var(--tx);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .15s}
.sw input:focus{border-color:var(--ac)}
.sw input::placeholder{color:var(--di)}
.si{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--di);font-size:14px;pointer-events:none}
.fbs{display:flex;gap:4px}
.fb{padding:5px 10px;border-radius:6px;border:1px solid var(--b1);background:transparent;color:var(--mu);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.fb:hover{color:var(--tx);border-color:var(--b2)}
.fb.on{background:var(--ac);border-color:var(--ac);color:#000;font-weight:500}
.st{margin-left:auto;color:var(--di);font-size:12px;white-space:nowrap}

/* ── BODY ── */
.body{display:flex;flex:1;overflow:hidden;position:relative}

/* ── SIDEBAR (desktop always visible, mobile = list root) ── */
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--b1);overflow-y:auto;padding:6px;background:var(--bg)}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.gl{font-size:10px;color:var(--di);padding:10px 8px 4px;text-transform:uppercase;letter-spacing:.1em;font-family:'DM Mono',monospace}
.vi{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:7px;cursor:pointer;transition:background .1s;border:1px solid transparent;margin-bottom:1px}
.vi:hover{background:var(--surf2)}
.vi.sel{background:var(--surf2);border-color:var(--b2)}
.ve{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.vt{flex:1;min-width:0}
.vit{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ven2{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbadge{font-size:10px;padding:1px 5px;border-radius:4px;font-family:'DM Mono',monospace;flex-shrink:0}
.are{background:#1a2a1a;color:var(--gr)}.ere{background:#1a1a2a;color:var(--bl)}.ire{background:#2a1a2a;color:var(--pu)}.irr{background:#2a1a1a;color:var(--re)}
.vi-chev{color:var(--b2);font-size:11px;flex-shrink:0;display:none}

/* ── MAIN PANEL ── */
.main{flex:1;overflow-y:auto;padding:28px 32px 64px;background:var(--bg)}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

/* ── VERB HEADER ── */
.vh{margin-bottom:32px;padding-bottom:22px;border-bottom:1px solid var(--b1)}
.vtitle{font-family:'Playfair Display',serif;font-size:46px;font-weight:700;color:var(--ac);line-height:1;margin-bottom:6px}
.veng{font-family:'Playfair Display',serif;font-size:17px;color:var(--tx);font-style:italic;margin-bottom:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;font-family:'DM Mono',monospace;border:1px solid}
.t-are{background:#1a2a1a;color:var(--gr);border-color:#2a4a2a}
.t-ere{background:#1a1a2a;color:var(--bl);border-color:#2a2a4a}
.t-ire{background:#2a1a2a;color:var(--pu);border-color:#3a2a3a}
.t-irr{background:#2a1a1a;color:var(--re);border-color:#4a2a2a}
.t-aux{background:var(--surf2);color:var(--mu);border-color:var(--b1)}

/* ── TENSE BLOCKS ── */
.tb{padding-top:36px;margin-top:36px;border-top:1px solid var(--b1)}
.tb:first-of-type{padding-top:0;margin-top:0;border-top:none}
.th{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.tn{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:var(--tx)}
.te{font-size:11px;color:var(--di);font-family:'DM Mono',monospace}
.note{font-size:13px;color:var(--mu);margin-bottom:14px;line-height:1.65;max-width:600px}
.note em{color:var(--ac);font-style:normal}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:14px}
.cr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;background:var(--surf);border:1px solid var(--b1)}
.cr:hover{border-color:var(--b2)}
.pro{font-size:11px;color:var(--di);font-family:'DM Mono',monospace;min-width:56px}
.form{font-size:15px;font-weight:500;color:var(--tx);font-family:'Playfair Display',serif}
.aux-e{font-size:12px;color:var(--te);font-family:'DM Mono',monospace;margin-right:4px}
.aux-a{font-size:12px;color:var(--pu);font-family:'DM Mono',monospace;margin-right:4px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:14px}
.pr{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:7px;background:var(--surf);border:1px solid var(--b1)}
.pr:hover{border-color:var(--b2)}
.pst{color:var(--te);font-family:'DM Mono',monospace;font-size:12px;min-width:44px}
.pge{color:var(--tx);font-family:'Playfair Display',serif;font-size:15px}
.exs{display:flex;flex-direction:column;gap:6px}
.ex{border-left:2px solid var(--b2);border-radius:0 7px 7px 0;padding:10px 14px;background:var(--surf2)}
.ex.hi{border-left-color:var(--ac)}
.ei{font-family:'Playfair Display',serif;font-size:15px;color:var(--tx);margin-bottom:3px}
.ee{font-size:12px;color:var(--mu);font-style:italic}

/* ── NAV ── */
.nav{display:flex;align-items:center;gap:8px;margin-top:48px;padding-top:22px;border-top:1px solid var(--b1)}
.nb{padding:7px 16px;border-radius:7px;border:1px solid var(--b1);background:transparent;color:var(--mu);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .15s}
.nb:hover:not(:disabled){border-color:var(--b2);color:var(--tx);background:var(--surf2)}
.nb:disabled{opacity:.3;cursor:default}
.nc{margin:0 auto;font-size:12px;color:var(--di)}
.nc b{color:var(--mu)}

/* ── QUIZ ── */
.qq{font-family:'Playfair Display',serif;font-size:21px;color:var(--tx);margin-bottom:18px;line-height:1.4}
.qq em{color:var(--ac);font-style:normal}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}
.qb{padding:12px 15px;border-radius:8px;border:1px solid var(--b1);background:var(--surf);color:var(--tx);cursor:pointer;text-align:left;font-family:'Playfair Display',serif;font-size:14px;transition:all .15s}
.qb:hover:not(:disabled){border-color:var(--b2);background:var(--surf2)}
.qb.ok{border-color:var(--gr)!important;background:#0d1f13!important;color:var(--gr)!important}
.qb.no{border-color:var(--re)!important;background:#1f0d0d!important;color:var(--re)!important}
.qsc{color:var(--ac);font-family:'DM Mono',monospace}
.qrs{padding:4px 10px;border-radius:6px;border:1px solid var(--b1);background:transparent;color:var(--mu);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif}
.qrs:hover{border-color:var(--ac);color:var(--ac)}
.qnx{padding:8px 18px;border-radius:7px;border:1px solid var(--ac);background:transparent;color:var(--ac);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .15s}
.qnx:hover{background:var(--ac);color:#000}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80%;color:var(--di);gap:8px}
.ebig{font-family:'Playfair Display',serif;font-size:64px;opacity:.12;font-style:italic}

/* ══════════════════════════════════════
   MOBILE  ≤ 699px
   List = root screen.
   Detail = slides in from the right.
   Desktop (≥700px) stays completely unchanged.
══════════════════════════════════════ */
@media (max-width:699px){
  /* search bar wraps nicely */
  .top{flex-wrap:wrap;padding:8px 12px;gap:6px}
  .sw{max-width:none;flex:1 1 160px}
  .fbs{gap:4px;overflow-x:auto;flex-wrap:nowrap}
  .fbs::-webkit-scrollbar{display:none}
  .st{display:none}

  /* body is a clip container */
  .body{overflow:hidden}

  /* sidebar becomes full-width list root */
  .sidebar{
    position:absolute;inset:0;
    width:100%;border-right:none;
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    transform:translateX(0);
    z-index:1;
  }
  .sidebar.slide-out{transform:translateX(-100%)}

  /* show chevron on mobile list items */
  .vi-chev{display:block}

  /* main becomes a full-width detail screen */
  .main{
    position:absolute;inset:0;
    width:100%;padding:16px 16px 72px;
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    transform:translateX(100%);
    z-index:2;
  }
  .main.slide-in{transform:translateX(0)}

  /* back button — only shown on mobile detail */
  .back-btn{display:flex;align-items:center;gap:6px;color:var(--ac);font-size:14px;cursor:pointer;margin-bottom:18px;user-select:none}
  .back-btn:active{opacity:.6}

  /* single-column grids on narrow screens */
  .cg,.pg{grid-template-columns:1fr}
  .qo{grid-template-columns:1fr}
  .vtitle{font-size:34px}
}

/* back button hidden on desktop */
@media (min-width:700px){
  .back-btn{display:none}
}
</style>
</head>
<body>
<div class="shell">

  <div class="top">
    <div class="logo" onclick="goHome()">verbi <span>italiani</span></div>

    <div class="fbs">
      <button class="fb" id="f-are" onclick="tog('are')">-are</button>

    </div>

  <div class="body">

    <div class="main" id="main">

    </div>
  </div>

</div>

const STARE=['sto','stai','sta','stiamo','state','stanno'];

{e:"❤️",it:"amare",en:"to love",g:"-are",i:false,pr:["amo","ami","ama","amiamo","amate","amano"],im:["amavo","amavi","amava","amavamo","amavate","amavano"],pp:"amato",ax:"avere",ex:{pr:[["Amo la musica italiana.","I love Italian music."],["Ti amo con tutto il cuore.","I love you with all my heart."],["Amiamo i viaggi in estate.","We love travelling in summer."]],pg:[["Sto amando ogni minuto.","I am loving every minute."],["Sta amando il nuovo lavoro.","She is loving the new job."],["Stiamo amando questa città.","We are loving this city."]],pe:[["Ho amato ogni momento.","I have loved every moment."],["Ha amato quella persona per anni.","He loved that person for years."],["Abbiamo amato quella città.","We loved that city."]],ip:[["Da bambino amavo il gelato.","As a child I loved ice cream."],["Amava stare in silenzio la sera.","She used to love sitting quietly in the evening."],["Amavamo andare al cinema insieme.","We used to love going to the cinema together."]]}},
{e:"🚶",it:"andare",en:"to go",g:"-are",i:true,pr:["vado","vai","va","andiamo","andate","vanno"],im:["andavo","andavi","andava","andavamo","andavate","andavano"],pp:"andato",ax:"essere",ex:{pr:[["Vado al lavoro in bici.","I go to work by bike."],["Vai spesso al mercato?","Do you often go to the market?"],["Vanno a scuola a piedi.","They walk to school."]],pg:[["Sto andando al supermercato.","I am going to the supermarket."],["Sta andando in ufficio.","He is going to the office."],["Stanno andando alla spiaggia.","They are going to the beach."]],pe:[["Sono andato a Roma la settimana scorsa.","I went to Rome last week."],["È andata al medico stamattina.","She went to the doctor this morning."],["Siamo andati al concerto ieri sera.","We went to the concert last night."]],ip:[["Andavamo al mare ogni estate.","We used to go to the sea every summer."],["Andava in palestra tre volte a settimana.","He used to go to the gym three times a week."],["Da piccola andavo a cavallo.","As a child I used to go horse riding."]]}},
{e:"🚪",it:"aprire",en:"to open",g:"-ire",i:false,pr:["apro","apri","apre","apriamo","aprite","aprono"],im:["aprivo","aprivi","apriva","aprivamo","aprivate","aprivano"],pp:"aperto",ax:"avere",ex:{pr:[["Apro il negozio alle nove.","I open the shop at nine."],["Apri la finestra, fa caldo.","Open the window, it's hot."],["Il bar apre presto la mattina.","The bar opens early in the morning."]],pg:[["Sto aprendo la posta.","I am opening the mail."],["Sta aprendo un nuovo ristorante.","She is opening a new restaurant."],["Stanno aprendo le scatole.","They are opening the boxes."]],pe:[["Ho aperto la finestra.","I opened the window."],["Ha aperto la lettera con curiosità.","He opened the letter with curiosity."],["Abbiamo aperto una bottiglia di vino.","We opened a bottle of wine."]],ip:[["Apriva sempre la porta per me.","She always opened the door for me."],["Apriva il negozio anche di domenica.","He used to open the shop even on Sundays."],["Aprivamo le finestre di notte in estate.","We used to open the windows at night in summer."]]}},
{e:"🛬",it:"arrivare",en:"to arrive",g:"-are",i:false,pr:["arrivo","arrivi","arriva","arriviamo","arrivate","arrivano"],im:["arrivavo","arrivavi","arrivava","arrivavamo","arrivavate","arrivavano"],pp:"arrivato",ax:"essere",ex:{pr:[["Arrivo sempre puntuale.","I always arrive on time."],["Il treno arriva alle tre.","The train arrives at three."],["Arrivano da tutto il mondo.","They arrive from all over the world."]],pg:[["Sto arrivando, aspettami!","I am arriving, wait for me!"],["Sta arrivando il temporale.","The storm is arriving."],["Stanno arrivando gli ospiti.","The guests are arriving."]],pe:[["È arrivato tardi ieri.","He arrived late yesterday."],["Siamo arrivati in perfetto orario.","We arrived right on time."],["Il pacco è arrivato finalmente.","The package finally arrived."]],ip:[["Arrivava sempre in ritardo.","He always used to arrive late."],["Arrivavamo esausti dopo il viaggio.","We always arrived exhausted after the trip."],["I turisti arrivavano ogni estate.","Tourists used to arrive every summer."]]}},
{e:"⏳",it:"aspettare",en:"to wait",g:"-are",i:false,pr:["aspetto","aspetti","aspetta","aspettiamo","aspettate","aspettano"],im:["aspettavo","aspettavi","aspettava","aspettavamo","aspettavate","aspettavano"],pp:"aspettato",ax:"avere",ex:{pr:[["Aspetto l'autobus da dieci minuti.","I have been waiting for the bus for ten minutes."],["Aspetta fuori, arrivo subito.","Wait outside, I'll be right there."],["Aspettiamo notizie dal dottore.","We are waiting for news from the doctor."]],pg:[["Sto aspettando il mio turno.","I am waiting for my turn."],["Sta aspettando una risposta.","She is waiting for a reply."],["Stanno aspettando in fila.","They are waiting in line."]],pe:[["Ho aspettato un'ora sotto la pioggia.","I waited an hour in the rain."],["Ha aspettato tutta la mattina.","She waited all morning."],["Abbiamo aspettato invano.","We waited in vain."]],ip:[["Aspettava sempre con pazienza.","She always waited patiently."],["Aspettavamo il treno ogni mattina.","We used to wait for the train every morning."],["Da bambino aspettava il Natale con gioia.","As a child he used to wait for Christmas with joy."]]}},
{e:"👜",it:"avere",en:"to have",g:"-ere",i:true,pr:["ho","hai","ha","abbiamo","avete","hanno"],im:["avevo","avevi","aveva","avevamo","avevate","avevano"],pp:"avuto",ax:"avere",ex:{pr:[["Ho due gatti e un cane.","I have two cats and a dog."],["Hai tempo per un caffè?","Do you have time for a coffee?"],["Hanno molta esperienza nel campo.","They have a lot of experience in the field."]],pg:[["Sto avendo qualche problema tecnico.","I am having some technical trouble."],["Sta avendo una settimana difficile.","She is having a difficult week."],["Stanno avendo un acceso dibattito.","They are having a heated debate."]],pe:[["Ho avuto molto lavoro questo mese.","I have had a lot of work this month."],["Ha avuto la febbre per tre giorni.","He had a fever for three days."],["Abbiamo avuto fortuna con il tempo.","We were lucky with the weather."]],ip:[["Aveva una bella casa in campagna.","She had a beautiful house in the countryside."],["Avevamo un vecchio cane di nome Rex.","We used to have an old dog named Rex."],["Da giovane aveva molti amici.","When he was young he had many friends."]]}},
{e:"🥤",it:"bere",en:"to drink",g:"-ere",i:true,pr:["bevo","bevi","beve","beviamo","bevete","bevono"],im:["bevevo","bevevi","beveva","bevevamo","bevevate","bevevano"],pp:"bevuto",ax:"avere",ex:{pr:[["Bevo un caffè ogni mattina.","I drink a coffee every morning."],["Beviamo acqua minerale a tavola.","We drink mineral water at the table."],["Bevono troppa birra il venerdì sera.","They drink too much beer on Friday nights."]],pg:[["Sto bevendo il tè.","I am drinking tea."],["Sta bevendo l'ultimo sorso.","He is drinking the last sip."],["Stanno bevendo un aperitivo.","They are drinking an aperitif."]],pe:[["Ho bevuto tutta l'acqua.","I drank all the water."],["Ha bevuto tre caffè stamattina.","She drank three coffees this morning."],["Abbiamo bevuto un vino eccellente.","We drank an excellent wine."]],ip:[["Beveva solo acqua minerale.","He used to drink only mineral water."],["Da ragazza beveva latte caldo la sera.","As a girl she used to drink warm milk in the evening."],["Bevevamo limonata fatta in casa d'estate.","We used to drink homemade lemonade in summer."]]}},

{e:"😴",it:"dormire",en:"to sleep",g:"-ire",i:false,pr:["dormo","dormi","dorme","dormiamo","dormite","dormono"],im:["dormivo","dormivi","dormiva","dormivamo","dormivate","dormivano"],pp:"dormito",ax:"avere",ex:{pr:[["Dormo otto ore ogni notte.","I sleep eight hours every night."],["Dormi abbastanza?","Do you sleep enough?"],["I bambini dormono già.","The children are already asleep."]],pg:[["Sto dormendo sul divano.","I am sleeping on the sofa."],["Stai dormendo? Svegliati!","Are you sleeping? Wake up!"],["Il gatto sta dormendo al sole.","The cat is sleeping in the sun."]],pe:[["Ho dormito malissimo stanotte.","I slept very badly last night."],["Ha dormito dodici ore di fila.","She slept twelve hours straight."],["Abbiamo dormito sotto le stelle.","We slept under the stars."]],ip:[["Dormiva sempre fino a mezzogiorno.","He used to sleep until midday."],["Da ragazza dormivo pochissimo.","As a girl I used to sleep very little."],["Dormivano in tenda in montagna.","They used to sleep in a tent in the mountains."]]}},

{e:"📦",it:"mettere",en:"to put",g:"-ere",i:false,pr:["metto","metti","mette","mettiamo","mettete","mettono"],im:["mettevo","mettevi","metteva","mettevamo","mettevate","mettevano"],pp:"messo",ax:"avere",ex:{pr:[["Metto i libri nello zaino.","I put the books in my bag."],["Dove metti le chiavi di solito?","Where do you usually put the keys?"],["Mettono sempre troppo sale.","They always put in too much salt."]],pg:[["Sto mettendo tutto in ordine.","I am putting everything in order."],["Sta mettendo via i vestiti.","She is putting away the clothes."],["Stanno mettendo le valigie in macchina.","They are putting the suitcases in the car."]],pe:[["Ho messo tutto in ordine.","I put everything in order."],["Ha messo la firma sul contratto.","She signed the contract."],["Abbiamo messo da parte dei soldi.","We put some money aside."]],ip:[["Metteva sempre troppo sale nel sugo.","She always used to add too much salt to the sauce."],["Mettevo la sveglia ogni sera.","I used to set the alarm every evening."],["Mettevano i bambini a letto presto.","They used to put the children to bed early."]]}},
{e:"🗣️",it:"parlare",en:"to speak",g:"-are",i:false,pr:["parlo","parli","parla","parliamo","parlate","parlano"],im:["parlavo","parlavi","parlava","parlavamo","parlavate","parlavano"],pp:"parlato",ax:"avere",ex:{pr:[["Parlo italiano e spagnolo.","I speak Italian and Spanish."],["Parli molto bene l'italiano!","You speak Italian very well!"],["Parlano troppo e agiscono poco.","They talk too much and act too little."]],pg:[["Sto parlando con il direttore.","I am speaking with the director."],["Sta parlando al telefono.","She is talking on the phone."],["Stanno parlando di te.","They are talking about you."]],pe:[["Abbiamo parlato per ore al telefono.","We talked on the phone for hours."],["Ha parlato davanti a tutta la classe.","She spoke in front of the whole class."],["Ho parlato con lui ieri sera.","I spoke with him last night."]],ip:[["Parlava sempre troppo.","He always used to talk too much."],["Da bambina parlavo poco.","As a child I used to speak very little."],["Parlavano in dialetto tra di loro.","They used to speak in dialect among themselves."]]}},
{e:"💡",it:"pensare",en:"to think",g:"-are",i:false,pr:["penso","pensi","pensa","pensiamo","pensate","pensano"],im:["pensavo","pensavi","pensava","pensavamo","pensavate","pensavano"],pp:"pensato",ax:"avere",ex:{pr:[["Penso che tu abbia ragione.","I think you are right."],["A cosa pensi?","What are you thinking about?"],["Pensano di partire domani.","They are thinking of leaving tomorrow."]],pg:[["Sto pensando a una soluzione.","I am thinking of a solution."],["Sta pensando prima di rispondere.","He is thinking before answering."],["Stiamo pensando di trasferirci.","We are thinking of moving."]],pe:[["Ho pensato molto alla tua proposta.","I have thought a lot about your proposal."],["Ha pensato a lungo prima di decidere.","She thought for a long time before deciding."],["Abbiamo pensato insieme al problema.","We thought about the problem together."]],ip:[["Pensava sempre agli altri prima di sé.","She always used to think of others before herself."],["Da giovane pensavo di diventare attore.","As a young man I used to think I would become an actor."],["Pensavamo che fosse impossibile.","We used to think it was impossible."]]}},
{e:"😢",it:"perdere",en:"to lose",g:"-ere",i:false,pr:["perdo","perdi","perde","perdiamo","perdete","perdono"],im:["perdevo","perdevi","perdeva","perdevamo","perdevate","perdevano"],pp:"perso",ax:"avere",ex:{pr:[["Perdo sempre le chiavi.","I always lose my keys."],["Perdi spesso la pazienza?","Do you often lose your patience?"],["Perdono tempo invece di lavorare.","They waste time instead of working."]],pg:[["Sto perdendo la speranza.","I am losing hope."],["Sta perdendo il treno.","She is missing the train."],["Stanno perdendo la partita.","They are losing the match."]],pe:[["Ho perso il treno delle otto.","I missed the eight o'clock train."],["Ha perso il portafoglio sul bus.","She lost her wallet on the bus."],["Abbiamo perso la strada nel bosco.","We lost our way in the woods."]],ip:[["Perdeva sempre al gioco.","He always used to lose at cards."],["Perdevo spesso le cose da bambino.","I used to lose things often as a child."],["Perdevano tempo a discutere di niente.","They used to waste time arguing about nothing."]]}},
{e:"😊",it:"piacere",en:"to like",g:"-ere",i:true,pr:["piaccio","piaci","piace","piacciamo","piacete","piacciono"],im:["piacevo","piacevi","piaceva","piacevamo","piacevate","piacevano"],pp:"piaciuto",ax:"essere",ex:{pr:[["Mi piace moltissimo la pizza napoletana.","I really like Neapolitan pizza."],["Ti piace la musica classica?","Do you like classical music?"],["Gli piacciono i gatti più dei cani.","He likes cats more than dogs."]],pg:[["Mi sta piacendo tantissimo questo film.","I am really enjoying this film."],["Ti sta piacendo il viaggio?","Are you enjoying the trip?"],["Gli sta piacendo la nuova città.","He is enjoying the new city."]],pe:[["Mi è piaciuto molto il film.","I really liked the film."],["Le è piaciuta la torta.","She liked the cake."],["Ci è piaciuto tantissimo quel ristorante.","We really liked that restaurant."]],ip:[["Gli piaceva molto la musica classica.","He used to really like classical music."],["Da bambina mi piacevano i cartoni animati.","As a child I used to like cartoons."],["Ci piaceva passeggiare la domenica mattina.","We used to like walking on Sunday mornings."]]}},
{e:"🎒",it:"portare",en:"to bring / carry",g:"-are",i:false,pr:["porto","porti","porta","portiamo","portate","portano"],im:["portavo","portavi","portava","portavamo","portavate","portavano"],pp:"portato",ax:"avere",ex:{pr:[["Porto sempre l'ombrello.","I always bring an umbrella."],["Porti tu il dolce?","Will you bring the dessert?"],["Portano sempre regali quando vengono a cena.","They always bring gifts when they come to dinner."]],pg:[["Sto portando le borse al piano di sopra.","I am carrying the bags upstairs."],["Sta portando i bambini a scuola.","She is taking the children to school."],["Stanno portando i mobili nel nuovo appartamento.","They are carrying furniture into the new flat."]],pe:[["Ho portato il vino.","I brought the wine."],["Ha portato i fiori alla nonna.","He brought flowers to grandma."],["Abbiamo portato tutto il necessario.","We brought everything we needed."]],ip:[["Portava sempre fiori alla nonna.","He used to always bring flowers to grandma."],["Portavo lo zaino pesantissimo a scuola.","I used to carry a very heavy backpack to school."],["Portavano i bambini al parco ogni domenica.","They used to take the children to the park every Sunday."]]}},
{e:"💪",it:"potere",en:"can / to be able to",g:"-ere",i:true,pr:["posso","puoi","può","possiamo","potete","possono"],im:["potevo","potevi","poteva","potevamo","potevate","potevano"],pp:"potuto",ax:"avere",ex:{pr:[["Posso aiutarti con piacere.","I can help you with pleasure."],["Puoi aprire la finestra?","Can you open the window?"],["Non possono venire stasera.","They can't come tonight."]],pg:[["Sto potendo finalmente riposare.","I am finally getting to rest."],["Sta potendo uscire di più adesso.","She is now able to go out more."],["Stanno potendo lavorare da casa.","They are now able to work from home."]],pe:[["Non ho potuto venire alla festa.","I was not able to come to the party."],["Ha potuto finalmente comprare casa.","He was finally able to buy a house."],["Abbiamo potuto visitare il museo.","We were able to visit the museum."]],ip:[["Non poteva dormire bene per l'ansia.","He could not sleep well because of anxiety."],["Non potevo uscire da sola da bambina.","I was not allowed to go out alone as a child."],["Potevano lavorare senza interruzioni.","They used to be able to work without interruptions."]]}},
{e:"✋",it:"prendere",en:"to take",g:"-ere",i:false,pr:["prendo","prendi","prende","prendiamo","prendete","prendono"],im:["prendevo","prendevi","prendeva","prendevamo","prendevate","prendevano"],pp:"preso",ax:"avere",ex:{pr:[["Prendo il treno ogni giorno.","I take the train every day."],["Prendi un caffè?","Will you have a coffee?"],["Prendono sempre la stessa strada.","They always take the same road."]],pg:[["Sto prendendo il sole.","I am sunbathing."],["Sta prendendo appunti.","She is taking notes."],["Stanno prendendo una decisione.","They are making a decision."]],pe:[["Ho preso un caffè al bar.","I had a coffee at the bar."],["Ha preso il primo aereo disponibile.","He took the first available flight."],["Abbiamo preso la decisione giusta.","We made the right decision."]],ip:[["Prendeva medicine ogni mattina.","She used to take medicine every morning."],["Prendevo sempre il treno delle sette.","I always used to take the seven o'clock train."],["Prendevano lezioni di musica insieme.","They used to take music lessons together."]]}},
{e:"🧪",it:"provare",en:"to try",g:"-are",i:false,pr:["provo","provi","prova","proviamo","provate","provano"],im:["provavo","provavi","provava","provavamo","provavate","provavano"],pp:"provato",ax:"avere",ex:{pr:[["Provo sempre nuove ricette.","I always try new recipes."],["Hai provato il tiramisù di questo posto?","Have you tried the tiramisu here?"],["Provano sempre cose nuove.","They always try new things."]],pg:[["Sto provando a capire.","I am trying to understand."],["Sta provando un vestito nuovo.","She is trying on a new dress."],["Stanno provando la canzone per il concerto.","They are rehearsing the song for the concert."]],pe:[["Ho provato di tutto.","I have tried everything."],["Ha provato a telefonare ma non rispondevi.","She tried to call but you didn't answer."],["Abbiamo provato il ristorante nuovo.","We tried the new restaurant."]],ip:[["Provava sempre cose nuove.","She always used to try new things."],["Provavo a imparare la chitarra da solo.","I used to try to learn guitar on my own."],["Provavano ogni giorno senza arrendersi.","They used to try every day without giving up."]]}},
{e:"🏠",it:"restare",en:"to stay",g:"-are",i:false,pr:["resto","resti","resta","restiamo","restate","restano"],im:["restavo","restavi","restava","restavamo","restavate","restavano"],pp:"restato",ax:"essere",ex:{pr:[["Resto a casa questo weekend.","I am staying home this weekend."],["Resti a cena con noi?","Are you staying for dinner with us?"],["Restano spesso fino a tardi in ufficio.","They often stay late at the office."]],pg:[["Sto restando qualche giorno in più.","I am staying a few extra days."],["Sta restando tranquillo nonostante tutto.","He is staying calm despite everything."],["Stanno restando a guardare.","They are staying to watch."]],pe:[["Siamo restati tre giorni in più.","We stayed three days longer."],["È restata a casa con i bambini.","She stayed at home with the children."],["Sono restato sveglio tutta la notte.","I stayed awake all night."]],ip:[["Restava spesso a dormire da noi.","She often used to sleep over at our place."],["Restavo in casa quando pioveva.","I used to stay home when it rained."],["Restavano in silenzio per ore.","They used to stay in silence for hours."]]}},
{e:"😂",it:"ridere",en:"to laugh",g:"-ere",i:false,pr:["rido","ridi","ride","ridiamo","ridete","ridono"],im:["ridevo","ridevi","rideva","ridevamo","ridevate","ridevano"],pp:"riso",ax:"avere",ex:{pr:[["Rido sempre alle sue barzellette.","I always laugh at his jokes."],["Ridi troppo!","You laugh too much!"],["Ridono di tutto.","They laugh at everything."]],pg:[["Sto ridendo ancora.","I am still laughing."],["Sta ridendo come una matta.","She is laughing like crazy."],["Stanno ridendo di una storia divertente.","They are laughing about a funny story."]],pe:[["Abbiamo riso tutta la sera.","We laughed all evening."],["Ha riso così tanto da piangere.","She laughed so much she cried."],["Ho riso tantissimo a quel film.","I laughed a lot at that film."]],ip:[["Rideva di tutto.","She used to laugh at everything."],["Da bambino ridevo sempre.","As a child I was always laughing."],["Ridevano insieme ogni sera.","They used to laugh together every evening."]]}},
{e:"🧍",it:"rimanere",en:"to remain",g:"-ere",i:true,pr:["rimango","rimani","rimane","rimaniamo","rimanete","rimangono"],im:["rimanevo","rimanevi","rimaneva","rimanevamo","rimanevate","rimanevano"],pp:"rimasto",ax:"essere",ex:{pr:[["Rimango a casa stasera.","I am staying home tonight."],["Rimani ancora un po'?","Are you staying a little longer?"],["Rimangono sempre colpiti dal paesaggio.","They are always struck by the landscape."]],pg:[["Sto rimanendo calmo.","I am remaining calm."],["Sta rimanendo oltre l'orario.","She is staying past closing time."],["Stanno rimanendo in silenzio.","They are remaining silent."]],pe:[["Siamo rimasti colpiti.","We were impressed."],["È rimasto senza parole.","He was left speechless."],["Sono rimasta a casa tutto il giorno.","I stayed home all day."]],ip:[["Rimaneva sempre calmo.","He always used to remain calm."],["Rimanevo a volte senza risposta.","I sometimes used to be left without an answer."],["Rimanevano spesso in silenzio.","They often used to remain in silence."]]}},
{e:"❓",it:"rispondere",en:"to answer",g:"-ere",i:false,pr:["rispondo","rispondi","risponde","rispondiamo","rispondete","rispondono"],im:["rispondevo","rispondevi","rispondeva","rispondevamo","rispondevate","rispondevano"],pp:"risposto",ax:"avere",ex:{pr:[["Rispondo subito alle email.","I answer emails right away."],["Rispondi al telefono per favore.","Please answer the phone."],["Rispondono sempre in modo educato.","They always answer politely."]],pg:[["Sto rispondendo ai messaggi.","I am replying to messages."],["Sta rispondendo alla domanda.","She is answering the question."],["Stanno rispondendo alle critiche.","They are responding to the criticism."]],pe:[["Non ha risposto al telefono.","She did not answer the phone."],["Ho risposto a tutte le domande.","I answered all the questions."],["Abbiamo risposto per tempo.","We replied in time."]],ip:[["Non rispondeva mai alle lettere.","He never used to reply to letters."],["Rispondevo sempre in modo diretto.","I always used to answer directly."],["Rispondevano a ogni domanda con pazienza.","They used to answer every question with patience."]]}},
{e:"🔙",it:"tornare",en:"to return",g:"-are",i:false,pr:["torno","torni","torna","torniamo","tornate","tornano"],im:["tornavo","tornavi","tornava","tornavamo","tornavate","tornavano"],pp:"tornato",ax:"essere",ex:{pr:[["Torno a casa alle sette di sera.","I return home at seven in the evening."],["A che ora torni?","What time are you coming back?"],["Tornano sempre dal mare abbronzati.","They always come back from the sea tanned."]],pg:[["Sto tornando a casa adesso.","I am heading home now."],["Sta tornando dalla palestra.","She is coming back from the gym."],["Stanno tornando dal viaggio.","They are returning from the trip."]],pe:[["È tornato dal viaggio esausto.","He returned from the trip exhausted."],["Siamo tornati dopo mezzanotte.","We got back after midnight."],["È tornata a vivere nella sua città natale.","She returned to live in her hometown."]],ip:[["Tornava sempre a piedi anche di notte.","She always used to walk home even at night."],["Tornavo tardi ogni sera quel mese.","I used to come home late every evening that month."],["Tornavano insieme dalla scuola ogni giorno.","They used to come back from school together every day."]]}},
{e:"🔍",it:"trovare",en:"to find",g:"-are",i:false,pr:["trovo","trovi","trova","troviamo","trovate","trovano"],im:["trovavo","trovavi","trovava","trovavamo","trovavate","trovavano"],pp:"trovato",ax:"avere",ex:{pr:[["Trovo sempre parcheggio qui.","I always find parking here."],["Trovi facilmente quello che cerchi?","Do you find what you're looking for easily?"],["Trovano sempre un modo per farcela.","They always find a way to manage."]],pg:[["Sto trovando tutto molto interessante.","I am finding everything very interesting."],["Sta trovando il suo ritmo.","She is finding her rhythm."],["Stanno trovando difficoltà.","They are finding it difficult."]],pe:[["Ho trovato un appartamento bellissimo.","I found a beautiful flat."],["Ha trovato il portafoglio sul bus.","He found the wallet on the bus."],["Abbiamo trovato la soluzione giusta.","We found the right solution."]],ip:[["Trovava sempre la soluzione giusta.","She always used to find the right solution."],["Trovavo difficile alzarmi presto.","I used to find it hard to get up early."],["Trovavano sempre qualcosa da fare.","They always used to find something to do."]]}},
{e:"🚶",it:"uscire",en:"to go out",g:"-ire",i:true,pr:["esco","esci","esce","usciamo","uscite","escono"],im:["uscivo","uscivi","usciva","uscivamo","uscivate","uscivano"],pp:"uscito",ax:"essere",ex:{pr:[["Esco con gli amici ogni sabato sera.","I go out with friends every Saturday night."],["Esci stasera?","Are you going out tonight?"],["Escono raramente la settimana.","They rarely go out during the week."]],pg:[["Sto uscendo adesso.","I am going out now."],["Sta uscendo dall'ufficio.","She is leaving the office."],["Stanno uscendo tutti insieme.","They are all going out together."]],pe:[["È uscita senza ombrello e si è bagnata.","She went out without an umbrella and got wet."],["Siamo usciti a cena ieri.","We went out for dinner yesterday."],["È uscito di casa alle sei.","He left the house at six."]],ip:[["Usciva raramente di sera.","He rarely used to go out in the evening."],["Uscivo ogni weekend con gli amici.","I used to go out every weekend with friends."],["Uscivano sempre insieme il giovedì.","They always used to go out together on Thursdays."]]}},
{e:"👁️",it:"vedere",en:"to see",g:"-ere",i:false,pr:["vedo","vedi","vede","vediamo","vedete","vedono"],im:["vedevo","vedevi","vedeva","vedevamo","vedevate","vedevano"],pp:"visto",ax:"avere",ex:{pr:[["Vedo i miei amici ogni weekend.","I see my friends every weekend."],["Vedi bene senza occhiali?","Can you see well without glasses?"],["Vedono il mondo in modo diverso.","They see the world differently."]],pg:[["Sto vedendo un film meraviglioso.","I am watching a wonderful film."],["Sta vedendo qualcuno?","Is she seeing someone?"],["Stiamo vedendo i risultati del lavoro.","We are seeing the results of our work."]],pe:[["Ho visto un film bellissimo ieri sera.","I saw a wonderful film last night."],["Ha visto la Torre Eiffel per la prima volta.","She saw the Eiffel Tower for the first time."],["Abbiamo visto tutto quello che c'era da vedere.","We saw everything there was to see."]],ip:[["Vedeva poco senza occhiali.","She could barely see without glasses."],["Da bambino vedevo i miei nonni ogni giorno.","As a child I used to see my grandparents every day."],["Vedevamo spesso l'aurora boreale da lì.","We used to often see the northern lights from there."]]}},
{e:"👋",it:"venire",en:"to come",g:"-ire",i:true,pr:["vengo","vieni","viene","veniamo","venite","vengono"],im:["venivo","venivi","veniva","venivamo","venivate","venivano"],pp:"venuto",ax:"essere",ex:{pr:[["Vengo subito, aspettami.","I'm coming right away, wait for me."],["Vieni alla festa sabato?","Are you coming to the party on Saturday?"],["Vengono da molti paesi diversi.","They come from many different countries."]],pg:[["Sto venendo, ci metto cinque minuti.","I am coming, I'll be five minutes."],["Sta venendo a piedi.","She is coming on foot."],["Stanno venendo tutti insieme.","They are all coming together."]],pe:[["È venuta a trovarmi la settimana scorsa.","She came to visit me last week."],["Sono venuto appena ho potuto.","I came as soon as I could."],["Sono venuti da lontano per questa occasione.","They came from far away for this occasion."]],ip:[["Veniva spesso a cena da noi.","He used to come to dinner at our place often."],["Da bambino venivo qui ogni estate.","As a child I used to come here every summer."],["Venivano a trovarci ogni domenica.","They used to come and visit us every Sunday."]]}},
{e:"🏡",it:"vivere",en:"to live",g:"-ere",i:false,pr:["vivo","vivi","vive","viviamo","vivete","vivono"],im:["vivevo","vivevi","viveva","vivevamo","vivevate","vivevano"],pp:"vissuto",ax:"essere",ex:{pr:[["Vivo a Milano da tre anni.","I have been living in Milan for three years."],["Dove vivi adesso?","Where do you live now?"],["Vivono in una piccola casa in campagna.","They live in a small house in the countryside."]],pg:[["Sto vivendo il momento più bello della mia vita.","I am living the best moment of my life."],["Sta vivendo una situazione difficile.","She is going through a difficult situation."],["Stanno vivendo un sogno.","They are living a dream."]],pe:[["Ho vissuto in Spagna per un anno.","I lived in Spain for a year."],["Ha vissuto cent'anni.","He lived to be a hundred."],["Abbiamo vissuto momenti indimenticabili insieme.","We have lived unforgettable moments together."]],ip:[["Viveva in campagna da piccolo.","He used to live in the countryside as a child."],["Vivevo in un piccolo appartamento.","I used to live in a small flat."],["Vivevano senza preoccupazioni.","They used to live without worries."]]}},
{e:"❤️",it:"volere",en:"to want",g:"-ere",i:true,pr:["voglio","vuoi","vuole","vogliamo","volete","vogliono"],im:["volevo","volevi","voleva","volevamo","volevate","volevano"],pp:"voluto",ax:"avere",ex:{pr:[["Voglio imparare a suonare il pianoforte.","I want to learn to play the piano."],["Cosa vuoi mangiare stasera?","What do you want to eat tonight?"],["Vogliono cambiare tutto.","They want to change everything."]],pg:[["Sto volendo fare troppe cose insieme.","I am wanting to do too many things at once."],["Sembra che stia volendo andarsene.","It seems like he wants to leave."],["Stanno volendo troppo in poco tempo.","They are wanting too much in too little time."]],pe:[["Ho voluto provare qualcosa di nuovo.","I wanted to try something new."],["Ha voluto fare tutto da sola.","She wanted to do everything herself."],["Abbiamo voluto festeggiare in grande.","We wanted to celebrate in style."]],ip:[["Voleva diventare attrice da piccola.","She used to want to become an actress as a child."],["Volevo studiare architettura.","I used to want to study architecture."],["Volevamo costruire una casa in montagna.","We used to want to build a house in the mountains."]]}},
{e:"✍️",it:"scrivere",en:"to write",g:"-ere",i:false,pr:["scrivo","scrivi","scrive","scriviamo","scrivete","scrivono"],im:["scrivevo","scrivevi","scriveva","scrivevamo","scrivevate","scrivevano"],pp:"scritto",ax:"avere",ex:{pr:[["Scrivo nel mio diario ogni sera.","I write in my diary every evening."],["Scrivi molto bene in italiano.","You write very well in Italian."],["Scrivono articoli per una rivista locale.","They write articles for a local magazine."]],pg:[["Sto scrivendo una lettera a mia zia.","I am writing a letter to my aunt."],["Sta scrivendo il suo primo romanzo.","She is writing her first novel."],["Stiamo scrivendo le istruzioni insieme.","We are writing the instructions together."]],pe:[["Ho scritto una lettera lunga.","I wrote a long letter."],["Ha scritto tre romanzi in cinque anni.","She wrote three novels in five years."],["Abbiamo scritto insieme quella canzone.","We wrote that song together."]],ip:[["Scriveva poesie da giovane.","She used to write poems when she was young."],["Scrivevo lettere a mano ogni settimana.","I used to write letters by hand every week."],["Scrivevano l'uno all'altro ogni giorno.","They used to write to each other every day."]]}},

{e:"👶",it:"nascere",en:"to be born",g:"-ere",i:true,pr:["nasco","nasci","nasce","nasciamo","nascete","nascono"],im:["nascevo","nascevi","nasceva","nascevamo","nascevate","nascevano"],pp:"nato",ax:"essere",ex:{pr:[["Ogni giorno nascono nuove idee.","New ideas are born every day."],["Nasce una nuova era.","A new era is being born."],["Nascono circa 400.000 bambini al giorno nel mondo.","About 400,000 children are born every day in the world."]],pg:[["Sta nascendo qualcosa di speciale.","Something special is being born."],["Sta nascendo un nuovo movimento.","A new movement is being born."],["Stanno nascendo opportunità nuove.","New opportunities are being born."]],pe:[["Sono nato a Napoli.","I was born in Naples."],["È nata in una piccola città.","She was born in a small town."],["Siamo nati nello stesso ospedale.","We were born in the same hospital."]],ip:[["Nascevano molti figli in quella famiglia.","Many children used to be born in that family."],["Nascevo in un periodo difficile.","I was born in a difficult period."],["Nascevano nuove idee ogni giorno.","New ideas used to be born every day."]]}},
{e:"🏊",it:"nuotare",en:"to swim",g:"-are",i:false,pr:["nuoto","nuoti","nuota","nuotiamo","nuotate","nuotano"],im:["nuotavo","nuotavi","nuotava","nuotavamo","nuotavate","nuotavano"],pp:"nuotato",ax:"avere",ex:{pr:[["Nuoto tre volte a settimana.","I swim three times a week."],["Nuoti bene?","Can you swim well?"],["Nuotano in piscina ogni mattina.","They swim in the pool every morning."]],pg:[["Sto nuotando nel lago.","I am swimming in the lake."],["Sta nuotando contro corrente.","She is swimming against the current."],["Stanno nuotando verso la riva.","They are swimming towards the shore."]],pe:[["Ho nuotato per un'ora.","I swam for an hour."],["Ha nuotato attraverso il lago.","She swam across the lake."],["Abbiamo nuotato fino all'isola.","We swam to the island."]],ip:[["Nuotava come un pesce.","She used to swim like a fish."],["Nuotavo ogni estate al mare.","I used to swim in the sea every summer."],["Nuotavamo insieme ogni mattina.","They used to swim together every morning."]]}},
{e:"🧑‍🏫",it:"insegnare",en:"to teach",g:"-are",i:false,pr:["insegno","insegni","insegna","insegniamo","insegnate","insegnano"],im:["insegnavo","insegnavi","insegnava","insegnavamo","insegnavate","insegnavano"],pp:"insegnato",ax:"avere",ex:{pr:[["Insegno italiano all'università.","I teach Italian at university."],["Insegni matematica?","Do you teach maths?"],["Insegnano lingue straniere.","They teach foreign languages."]],pg:[["Sto insegnando a mio figlio ad andare in bici.","I am teaching my son to ride a bike."],["Sta insegnando ai nuovi colleghi.","She is teaching the new colleagues."],["Stanno insegnando tecniche avanzate.","They are teaching advanced techniques."]],pe:[["Ha insegnato per trent'anni.","She taught for thirty years."],["Ho insegnato inglese in Giappone.","I taught English in Japan."],["Abbiamo insegnato quello che sapevamo.","We taught what we knew."]],ip:[["Insegnava con grande passione.","He used to teach with great passion."],["Insegnavo in una scuola di campagna.","I used to teach in a country school."],["Insegnavano con metodi tradizionali.","They used to teach with traditional methods."]]}}
];

function ger(v){return v.g==='-are'?v.it.slice(0,-3)+'ando':v.it.slice(0,-3)+'endo'}

let idx=0, fil=[...V], actF=new Set(), qMode=false, qS={s:0,t:0,ans:false};
const isMobile=()=>window.innerWidth<700;

/* ── FILTERS ── */
function tog(f){actF.has(f)?actF.delete(f):actF.add(f);document.getElementById('f-'+f).classList.toggle('on',actF.has(f));applyF()}
function togQ(){qMode=!qMode;document.getElementById('f-quiz').classList.toggle('on',qMode);if(fil.length>0){qMode?rQuiz():rMain(fil[idx]);}}
function applyF(){
  const q=document.getElementById('sin').value.toLowerCase().trim();
  fil=V.filter(v=>{
    const mq=!q||v.it.includes(q)||v.en.toLowerCase().includes(q);
    if(!mq)return false;
    if(actF.size===0)return true;
    return(actF.has('are')&&v.g==='-are')||(actF.has('ere')&&v.g==='-ere')||(actF.has('ire')&&v.g==='-ire')||(actF.has('irr')&&v.i);
  });
  document.getElementById('stEl').textContent=fil.length+' verb'+(fil.length!==1?'s':'');
  idx=0; rList();
  if(fil.length>0){
    // on mobile, filtering just updates the list without navigating to detail
    if(isMobile()) showList();
    else rMain(fil[0]);
  } else {
    document.getElementById('main').innerHTML='<div class="empty"><div class="ebig">?</div><p>No verbs match</p></div>';
  }
}

/* ── NAVIGATION ── */
function showList(){
  document.getElementById('sidebar').classList.remove('slide-out');
  document.getElementById('main').classList.remove('slide-in');
}
function showDetail(){
  document.getElementById('sidebar').classList.add('slide-out');
  document.getElementById('main').classList.add('slide-in');
  document.getElementById('main').scrollTop=0;
}
function goBack(){
  if(isMobile()) showList();
}
function goHome(){
  qMode=false; document.getElementById('f-quiz').classList.remove('on');
  actF.clear(); ['are','ere','ire','irr'].forEach(f=>document.getElementById('f-'+f).classList.remove('on'));
  document.getElementById('sin').value='';
  fil=[...V]; idx=0;
  document.getElementById('stEl').textContent=fil.length+' verbs';
  rList();
  if(isMobile()) showList();
  else rMain(fil[0]);
}

/* ── LIST ── */
function rList(){
  const el=document.getElementById('sidebar'); let h='';
  ['-are','-ere','-ire'].forEach(g=>{
    const arr=fil.filter(v=>v.g===g); if(!arr.length)return;
    const c=g==='-are'?'are':g==='-ere'?'ere':'ire';
    h+=`<div class="gl">${g}</div>`;
    arr.forEach(v=>{
      const s=fil[idx]?.it===v.it?' sel':'';
      h+=`<div class="vi${s}" onclick="pick('${v.it}')">
        <span class="ve">${v.e}</span>
        <div class="vt"><div class="vit">${v.it}</div><div class="ven2">${v.en}</div></div>
        ${v.i?`<span class="vbadge irr">irr</span>`:`<span class="vbadge ${c}">${g}</span>`}
        <span class="vi-chev">›</span>
      </div>`;
    });
  });
  el.innerHTML=h;
}

function pick(it){
  const i=fil.findIndex(v=>v.it===it); if(i<0)return;
  idx=i; rList();
  if(qMode) rQuiz();
  else rMain(fil[idx]);
  if(isMobile()) showDetail();
}

/* ── DETAIL ── */
function exH(arr){return arr.map((x,j)=>`<div class="ex${j===0?' hi':''}"><div class="ei">${x[0]}</div><div class="ee">${x[1]}</div></div>`).join('')}

function rMain(v){
  const gc=v.g==='-are'?'t-are':v.g==='-ere'?'t-ere':'t-ire';
  const axf=v.ax==='essere'?['sono','sei','è','siamo','siete','sono']:['ho','hai','ha','abbiamo','avete','hanno'];
  const g=ger(v); const ac=v.ax==='essere'?'aux-e':'aux-a';
  const prev=fil[idx-1], next=fil[idx+1];

  document.getElementById('main').innerHTML=`
<div class="back-btn" onclick="goBack()"><span style="font-size:18px">‹</span> tutti i verbi</div>
<div class="vh">
  <div class="vtitle">${v.e} ${v.it}</div>
  <div class="veng">${v.en}</div>
  <div class="tags">
    <span class="tag ${gc}">${v.g}</span>
    ${v.i?'<span class="tag t-irr">irregular</span>':''}
    <span class="tag t-aux">aux: ${v.ax}</span>
  </div>
</div>

<div class="tb">
  <div class="th"><div class="tn">Presente</div><div class="te">present tense</div></div>
  <div class="note">Used for habits, ongoing facts, and general truths. Also covers English "I am …ing" in many situations.</div>
  <div class="cg">${PRO.map((p,i)=>`<div class="cr"><span class="pro">${p}</span><span class="form">${v.pr[i]}</span></div>`).join('')}</div>
  <div class="exs">${exH(v.ex.pr)}</div>
</div>

<div class="tb">
  <div class="th"><div class="tn">Progressivo</div><div class="te">present progressive</div></div>
  <div class="note"><em>stare</em> + gerundio — for something happening <em>right now</em>. Gerundio of <em>${v.it}</em>: <em>${g}</em>.</div>
  <div class="pg">${PRO.map((p,i)=>`<div class="pr"><span class="pro">${p}</span><span class="pst">${STARE[i]}</span><span class="pge">${g}</span></div>`).join('')}</div>
  <div class="exs">${exH(v.ex.pg)}</div>
</div>

<div class="tb">
  <div class="th"><div class="tn">Passato prossimo</div><div class="te">present perfect / simple past</div></div>
  <div class="note">The main past tense in spoken Italian. Auxiliary: <span style="color:${v.ax==='essere'?'var(--te)':'var(--pu)'};font-weight:500">${v.ax}</span> + <span style="color:var(--ac);font-weight:500">${v.pp}</span>. With <em>essere</em>, the participle agrees with the subject.</div>
  <div class="cg">${PRO.map((p,i)=>`<div class="cr"><span class="pro">${p}</span><span class="form"><span class="${ac}">${axf[i]}</span>${v.pp}</span></div>`).join('')}</div>
  <div class="exs">${exH(v.ex.pe)}</div>
</div>

<div class="tb">
  <div class="th"><div class="tn">Imperfetto</div><div class="te">imperfect</div></div>
  <div class="note">For past habits ("used to…"), background states and descriptions. Pairs with passato prossimo: imperfetto sets the scene, passato prossimo delivers the event.</div>
  <div class="cg">${PRO.map((p,i)=>`<div class="cr"><span class="pro">${p}</span><span class="form">${v.im[i]}</span></div>`).join('')}</div>
  <div class="exs">${exH(v.ex.ip)}</div>
</div>

<div class="nav">
  <button class="nb" ${!prev?'disabled':''} onclick="pick('${prev?.it||''}')">&larr; ${prev?.it||''}</button>
  <div class="nc"><b>${idx+1}</b> / ${fil.length}</div>
  <button class="nb" ${!next?'disabled':''} onclick="pick('${next?.it||''}')">${next?.it||''} &rarr;</button>
</div>`;
}

/* ── QUIZ ── */
function rQuiz(){
  const pool=fil.length>=4?fil:V;
  const qv=pool[Math.floor(Math.random()*pool.length)];
  const types=['meaning','pres','impf'];
  const qt=types[Math.floor(Math.random()*types.length)];
  let q='',cor='',opts=[];
  if(qt==='meaning'){
    q=`What does <em>${qv.e} ${qv.it}</em> mean?`; cor=qv.en;
    opts=[qv,...V.filter(v=>v.it!==qv.it).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5).map(v=>({l:v.en,v:v.en}));
  } else {
    const pi=Math.floor(Math.random()*6);
    const arr=qt==='pres'?qv.pr:qv.im;
    q=`<em>${PRO[pi]}</em> ___ — ${qt==='pres'?'present':'imperfect'} of <em>${qv.it}</em>?`;
    cor=arr[pi];
    opts=[{l:cor,v:cor},...V.filter(v=>v.it!==qv.it).sort(()=>Math.random()-.5).slice(0,3).map(v=>({l:(qt==='pres'?v.pr:v.im)[pi],v:(qt==='pres'?v.pr:v.im)[pi]}))].sort(()=>Math.random()-.5);
  }
  qS.ans=false;
  document.getElementById('main').innerHTML=`
<div class="back-btn" onclick="goBack()"><span style="font-size:18px">‹</span> tutti i verbi</div>
<div class="vh" style="margin-bottom:22px;padding-bottom:18px">
  <div class="vtitle" style="font-size:30px">Quiz ✦</div>
  <div style="display:flex;align-items:center;gap:10px;color:var(--di);font-size:13px;margin-top:6px">Score: <span class="qsc">${qS.s} / ${qS.t}</span><button class="qrs" onclick="qS={s:0,t:0,ans:false};rQuiz()">Reset</button></div>
</div>
<div class="qq">${q}</div>
<div class="qo">${opts.map(o=>`<button class="qb" data-v="${o.v.replace(/"/g,'&quot;')}" onclick="chk(this,'${o.v.replace(/'/g,"\\'")}','${cor.replace(/'/g,"\\'")}','${qv.it}')">${o.l}</button>`).join('')}</div>
<div id="qfb"></div>`;
  if(isMobile()) showDetail();
}
function chk(btn,chosen,cor,verbIt){
  if(qS.ans)return; qS.ans=true; qS.t++;
  const ok=chosen===cor; if(ok)qS.s++;
  document.querySelectorAll('.qb').forEach(b=>{b.disabled=true;if(b.dataset.v===cor)b.classList.add('ok');else if(b===btn&&!ok)b.classList.add('no')});
  const v=V.find(x=>x.it===verbIt);
  document.getElementById('qfb').innerHTML=`
<div style="margin-top:22px;padding-top:22px;border-top:1px solid var(--b1)">
  <div style="font-family:'Playfair Display',serif;font-size:16px;color:${ok?'var(--gr)':'var(--re)'};margin-bottom:12px">${ok?'✓ Corretto!':'✗ La risposta è: '+cor}</div>
  <div class="exs">${exH(v.ex.pr)}</div>
  <div style="margin-top:14px"><button class="qnx" onclick="rQuiz()">Next question &rarr;</button></div>
</div>`;
}

/* ── KEYBOARD ── */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'&&isMobile()){goBack();return;}
  if((e.key==='ArrowRight'||e.key==='ArrowDown')&&idx<fil.length-1){idx++;rList();qMode?rQuiz():rMain(fil[idx]);}
  else if((e.key==='ArrowLeft'||e.key==='ArrowUp')&&idx>0){idx--;rList();qMode?rQuiz():rMain(fil[idx]);}
});

/* ── INIT ── */
rList();
document.getElementById('stEl').textContent=fil.length+' verbs';
// desktop: show first verb immediately; mobile: stay on list
if(!isMobile()) rMain(fil[0]);
</script>
</body>
</html>
